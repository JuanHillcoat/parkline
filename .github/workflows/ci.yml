name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# Pull requests cancel superseded runs; pushes to main always run to completion.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Matches the local pnpm version. package.json has no packageManager field,
      # and pnpm/action-setup v6 needs an explicit version when it is absent.
      - uses: pnpm/action-setup@v6
        with:
          version: 11.23.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

      # Fails on a high or critical advisory in a production dependency: a vulnerable Next.js went
      # unnoticed once (https://github.com/JuanHillcoat/parkline/issues/46). It queries the npm registry,
      # so it runs last (an outage never hides the lint, type and test results), has its own time limit
      # and, if the registry is unreachable, fails, which is the safe direction.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high
        timeout-minutes: 5

  database:
    name: Migrations and database tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # Ephemeral development database. Credentials are local dev values, not secrets.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: parkline
          POSTGRES_PASSWORD: parkline_dev
          POSTGRES_DB: parkline
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U parkline -d parkline"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      # Two logins, as in local development. Migrations and the app-login command run as the
      # owner (the service user above). The application connects as a restricted login that
      # is a member of parkline_app. All values are CI-only throwaways, not secrets.
      MIGRATE_DATABASE_URL: postgres://parkline:parkline_dev@localhost:5432/parkline
      APP_DB_USER: parkline_login
      APP_DB_PASSWORD: ci-only-app-login-password
      DATABASE_URL: postgres://parkline_login:ci-only-app-login-password@localhost:5432/parkline
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          version: 11.23.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply migrations as the owner
        run: pnpm db:migrate

      - name: Create the restricted application login
        run: pnpm db:create-app-login

      # The database tests create and drop their own ephemeral databases, so their harness
      # needs the owner connection. They connect as parkline_app and as a login created by
      # db:create-app-login to prove the restrictions.
      - name: Database tests
        run: pnpm test:db
        env:
          DATABASE_URL: ${{ env.MIGRATE_DATABASE_URL }}

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      # Cluster the launcher creates its ephemeral database in. Local throwaway values, not secrets.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: parkline
          POSTGRES_PASSWORD: parkline_dev
          POSTGRES_DB: parkline
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U parkline -d parkline"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      # The launcher (e2e/support/start-server.ts) connects as this administrator, creates an
      # ephemeral database and a restricted login, builds the synthetic world and serves the
      # compiled app. See e2e/README.md and ADR-0009.
      E2E_ADMIN_DATABASE_URL: postgres://parkline:parkline_dev@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          version: 11.23.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install the browser
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm test:e2e

      # Only on failure, kept a week: artifact storage is limited on the free plan.
      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
