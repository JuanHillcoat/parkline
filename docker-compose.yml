# Local development and test database. Dev-only credentials; never use in production.
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-parkline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-parkline_dev}
      POSTGRES_DB: ${POSTGRES_DB:-parkline}
    ports:
      # Host port 54329 avoids clashing with other local Postgres instances.
      - "${POSTGRES_PORT:-54329}:5432"
    volumes:
      - parkline_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  parkline_pgdata:
